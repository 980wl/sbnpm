name: Unit and VPS tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python test suite
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          bash -n install.sh
          bash -n tests/smoke-vps.sh
          python -m py_compile sbnpm.py
  vps-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install and exercise all three protocols with real sing-box and nftables
        run: sudo bash tests/smoke-vps.sh
